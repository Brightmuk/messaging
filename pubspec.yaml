name: messaging
description: A modern SMS application for Android

publish_to: 'none'

version: 1.2.2+32

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  another_telephony: ^0.4.1
  permission_handler: ^12.0.3
  flutter_local_notifications: ^22.2.0
  provider: ^6.1.1
  url_launcher: ^6.3.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  intl: ^0.20.3
  flutter_contacts: ^2.3.1
  flutter_bloc: ^9.1.0
  package_info_plus: ^10.2.1
  event_bus: ^2.0.1
  toastification: ^3.0.3
  shared_preferences: ^2.5.3
  uuid: ^4.5.2
  sim_card_info: ^1.0.0
  equatable: ^2.0.7
  shimmer: ^3.0.0
  flutter_overlay_window: ^0.5.0
  android_intent_plus: ^6.0.0
  firebase_messaging: ^16.1.2
  firebase_core: ^4.5.0
  audioplayers: ^6.0.0
  scrollable_positioned_list: ^0.3.8
  pdf: ^3.10.8
  share_plus: ^13.3.0
  printing: ^5.13.1
  firebase_crashlytics: ^5.2.6
  firebase_analytics: ^12.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.4.0
  flutter_launcher_icons: "^0.14.4"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/icon-transparent.png"
  min_sdk_android: 21 
  adaptive_icon_background: "#006494" 
  adaptive_icon_foreground: "assets/images/icon-transparent.png"
  adaptive_icon_monochrome: "assets/images/icon-transparent.png"

